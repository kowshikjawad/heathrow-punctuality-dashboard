services:
  postgres:
    image: postgres:16-alpine
    container_name: heathrow_punctuality_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heathrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heathrow}
      POSTGRES_DB: ${POSTGRES_DB:-punctuality}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heathrow} -d ${POSTGRES_DB:-punctuality}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata: